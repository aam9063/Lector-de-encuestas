[project]
name = "ficha-tecnica"
version = "0.1.0"
description = "Ficha de lectura para noticias de encuestas electorales: qué información necesaria aparece y cuál falta."
readme = "../README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.118.3",
    "uvicorn[standard]>=0.38",
    "pydantic>=2.12",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "aiosqlite>=0.21",
    "pyyaml>=6.0.3",
    "trafilatura>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.3",
    "respx>=0.23",
    "ruff>=0.14.2",
    "pyright>=1.1.407",
]

[build-system]
requires = ["uv_build>=0.9", "uv-build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ficha_tecnica"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
