# Fictitious pollsters used by the synthetic evaluation corpus (ENC-16), listed for the
# same reason as the simulation parties: without them, the sanitizer and the entity layer
# never fire during evaluation and the "zero leaks" metric is vacuously true.
simulation_pollsters:
  - name: "Demoscopia Ficticia S.L."
    variants: ["Demoscopia Ficticia", "Encuestas Noveladas"]
