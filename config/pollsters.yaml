# Curated list of polling firms and organisms, with the variants seen in Spanish press.
#
# Purpose: give the code layer extra evidence for "does the text say who ran the poll?".
# It is NOT a filter and NOT a whitelist: a pollster missing here is still recognised by
# Clef, only with less corroborating evidence. So the failure mode of an incomplete list is
# a weaker evidence row, never a false accusation.
#
# Curation rules:
#   - one entry per organisation, with the name as it is used in the press;
#   - variants include abbreviations and the forms that appear in bylines;
#   - no political body, no media outlet, no aggregator: only who does fieldwork;
#   - a defunct firm stays if its polls still circulate in archived news.
#
# TODO: review after the hackathon. The list is deliberately conservative: adding a wrong
# name would attach evidence to the wrong organisation.
version: 1

pollsters:
  - name: "Centro de Investigaciones Sociológicas"
    variants: ["CIS", "Centro de Investigaciones Sociológicas", "Centro de Investigaciones Sociologicas"]
  - name: "GAD3"
    variants: ["GAD3", "GAD 3"]
  - name: "Sigma Dos"
    variants: ["Sigma Dos", "Sigmados"]
  - name: "40dB"
    variants: ["40dB", "40 db", "40 decibelios"]
  - name: "IMOP Insights"
    variants: ["IMOP", "IMOP Insights", "Institutos de Opinión Pública"]
  - name: "Simple Lógica"
    variants: ["Simple Lógica", "Simple Logica"]
  - name: "NC Report"
    variants: ["NC Report", "NCReport"]
  - name: "Celeste-Tel"
