# Clef questionnaire v1 (section 6.3). Snapshot-tested by ENC-06.
# noul -> probability of "yes"; choice -> probability per option;
# score -> distribution over levels. Field names confirmed against real fixtures.
version: 1

groups:
  A:  # technical sheet; single call, all noul
    - id: a_entity
      type: noul
      instructions: "Does the text say which company or body conducted the poll?"
    - id: a_entity_address
      type: noul
      instructions: "Does the text give the address or seat of the pollster?"
    - id: a_client
      type: noul
      instructions: "Does the text say who commissioned or funded the poll?"
    - id: a_sample_size
      type: noul
      instructions: "Does the text say how many people were interviewed?"
    - id: a_margin
      type: noul
      instructions: "Does the text state a margin of error for the poll?"
    - id: a_confidence
      type: noul
      instructions: "Does the text state the confidence level of the margin of error?"
    - id: a_universe
      type: noul
      instructions: "Does the text state which population the poll represents?"
    - id: a_sampling_system
      type: noul
      instructions: "Does the text explain the sampling system?"
    - id: a_selection_procedure
      type: noul
      instructions: "Does the text explain how respondents were selected or contacted?"
    - id: a_mode
      type: noul
      instructions: "Does the text say how the interviews were conducted?"
    - id: a_fieldwork_dates
      type: noul
      instructions: "Does the text state the fieldwork dates?"
    - id: a_question_text
      type: noul
      instructions: "Does the text reproduce the exact wording of the questions?"
    - id: a_nonresponse
      type: noul
      instructions: "Does the text state how many people did not answer each question?"
    - id: a_weighting
      type: noul
      instructions: "Does the text mention that data were weighted?"
    - id: a_external_sheet
      type: noul
      instructions: "Does the text refer to a technical sheet published elsewhere?"

  B:  # poll type and framing
    - id: b_poll_type
      type: choice
      instructions: "What kind of survey does the text describe?"
      options:
        - voting_intention_estimate
        - direct_voting_intention
        - leader_ratings
        - issue_opinion
        - self_selected_online_poll
        - poll_of_polls_or_model
        - not_a_poll
    - id: b_is_electoral
      type: noul
      instructions: "Is the text about voting intention or election results?"
    - id: b_prediction
      type: noul
      instructions: "Does the text present results as a prediction of the election outcome rather than a snapshot?"
    - id: b_lead_decisive
      type: noul
      instructions: "Does the headline or lede present one party as clearly ahead or winning?"
    - id: b_headline_overreach
      type: score
      instructions: "How much does the headline claim beyond what the data in the text support?"
      levels: ["Nada", "Poco", "Algo", "Bastante", "Mucho"]
    - id: b_subgroup
      type: noul
      instructions: "Does the text present small-subgroup results as if they held for the whole population?"

  C:  # wording; only if a_question_text >= 0.80 and quoted questions exist
    - id: c_leading
      type: noul
      instructions: "Does the wording of the question push towards a concrete answer?"
    - id: c_loaded_terms
      type: noul
      instructions: "Does the question use evaluative or emotional terms about any option?"
